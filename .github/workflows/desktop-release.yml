name: Desktop App Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 2.0.1)'
        required: true
        type: string

env:
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}

jobs:
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.result }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION=${GITHUB_REF#refs/tags/v}
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Validate version metadata
        run: |
          EXPECTED_VERSION=$(node -p "require('./package.json').version")
          if [ "$EXPECTED_VERSION" != "${{ steps.version.outputs.version }}" ]; then
            echo "Release version ${{ steps.version.outputs.version }} does not match package.json $EXPECTED_VERSION"
            exit 1
          fi

      - name: Generate Changelog
        id: changelog
        uses: mikepenz/release-changelog-builder-action@v4
        with:
          configuration: ".github/changelog-config.json"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release
        id: create-release
        uses: actions/github-script@v7
        with:
          script: |
            const tagName = `v${{ steps.version.outputs.version }}`
            const releaseParams = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tagName,
              name: `ripVID v${{ steps.version.outputs.version }}`,
              body: `${{ steps.changelog.outputs.changelog }}`,
              draft: true,
              prerelease: false
            }

            try {
              const { data: existing } = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: tagName
              })
              const { data: updated } = await github.rest.repos.updateRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: existing.id,
                name: releaseParams.name,
                body: releaseParams.body,
                draft: true,
                prerelease: false
              })
              return updated.id
            } catch (error) {
              if (error.status !== 404) throw error
              const { data: created } = await github.rest.repos.createRelease(releaseParams)
              return created.id
            }

  build-tauri:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
          include:
          - platform: 'macos-15'
            args: '--target aarch64-apple-darwin'
            target: 'aarch64-apple-darwin'
            os_name: 'macOS-arm64'
          - platform: 'macos-15-intel'
            args: '--target x86_64-apple-darwin'
            target: 'x86_64-apple-darwin'
            os_name: 'macOS-x64'
          - platform: 'ubuntu-22.04'
            args: ''
            target: ''
            os_name: 'Linux'
          - platform: 'windows-latest'
            args: ''
            target: ''
            os_name: 'Windows'

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      # Setup Bun
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Install system dependencies (Linux)
      - name: Install dependencies (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      # Install Rust
      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Cache Rust dependencies
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Install frontend dependencies
      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build frontend
        run: bun run build

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # Import Code Signing Certificate (macOS)
      - name: Import Code Signing Certificate (macOS)
        if: startsWith(matrix.platform, 'macos-')
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          KEYCHAIN_PWD: ${{ secrets.KEYCHAIN_PWD }}
        run: |
          if [ -n "$MACOS_CERTIFICATE" ]; then
            echo "Setting up macOS code signing..."
            echo "$MACOS_CERTIFICATE" | base64 --decode > certificate.p12
            security create-keychain -p "$KEYCHAIN_PWD" build.keychain
            security default-keychain -s build.keychain
            security unlock-keychain -p "$KEYCHAIN_PWD" build.keychain
            security import certificate.p12 -k build.keychain -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PWD" build.keychain
            echo "✅ Certificate imported successfully"
          else
            echo "⚠️  No macOS certificate configured - building unsigned app"
          fi

      # Setup Windows Code Signing Certificate
      - name: Setup Windows Code Signing
        if: matrix.platform == 'windows-latest'
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PWD: ${{ secrets.WINDOWS_CERTIFICATE_PWD }}
        run: |
          if ($env:WINDOWS_CERTIFICATE) {
            echo "Setting up Windows code signing..."
            # Certificate will be used by Tauri during build
          } else {
            echo "No Windows certificate configured - skipping code signing"
          }
        shell: pwsh

      # Verify signing keys are available
      - name: Verify Tauri Signing Keys
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "❌ ERROR: TAURI_SIGNING_PRIVATE_KEY is not set!"
            echo "Please check that the TAURI_PRIVATE_KEY secret exists in GitHub"
            exit 1
          else
            echo "✅ TAURI_SIGNING_PRIVATE_KEY is set (length: ${#TAURI_SIGNING_PRIVATE_KEY})"
          fi

          if [ -z "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" ]; then
            echo "❌ ERROR: TAURI_SIGNING_PRIVATE_KEY_PASSWORD is not set!"
            echo "Please check that the TAURI_KEY_PASSWORD secret exists in GitHub"
            exit 1
          else
            echo "✅ TAURI_SIGNING_PRIVATE_KEY_PASSWORD is set"
          fi
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        shell: bash

      # Build Tauri App
      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Tauri updater signing keys
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          # Only enable signing if certificates are available
          ENABLE_CODE_SIGNING: ${{ secrets.MACOS_CERTIFICATE != '' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE != '' && secrets.MACOS_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE != '' && secrets.MACOS_CERTIFICATE_PWD || '' }}
          APPLE_ID: ${{ secrets.MACOS_CERTIFICATE != '' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE != '' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ secrets.MACOS_CERTIFICATE != '' && secrets.APPLE_TEAM_ID || '' }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE || '' }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PWD || '' }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          tagName: v${{ needs.create-release.outputs.version }}
          releaseName: ripVID v${{ needs.create-release.outputs.version }}
          args: ${{ matrix.args }}
          includeUpdaterJson: true
          updaterJsonPreferNsis: true

      # Upload build artifacts
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ripvid-${{ matrix.os_name }}-${{ needs.create-release.outputs.version }}
          path: |
            src-tauri/target/release/bundle/**/*
          if-no-files-found: error
          retention-days: 30

  publish-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: [create-release, build-tauri, security-scan, validate-artifacts]

    steps:
      - uses: actions/checkout@v4

      # Publish Release
      - name: Publish Release
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ needs.create-release.outputs.release_id }},
              draft: false
            })

      # Create Sentry Release (if configured)
      - name: Create Sentry Release
        if: env.SENTRY_AUTH_TOKEN != ''
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: |
          curl -sL https://sentry.io/get-cli/ | bash
          sentry-cli releases new "ripvid@${{ needs.create-release.outputs.version }}"
          sentry-cli releases set-commits "ripvid@${{ needs.create-release.outputs.version }}" --auto
          sentry-cli releases finalize "ripvid@${{ needs.create-release.outputs.version }}"

      # Notify success
      - name: Notify Release Success
        run: |
          echo "✅ Release v${{ needs.create-release.outputs.version }} published successfully!"
          echo "🔗 View release: https://github.com/${{ github.repository }}/releases/tag/v${{ needs.create-release.outputs.version }}"

  validate-artifacts:
    runs-on: ubuntu-latest
    needs: [create-release, build-tauri]

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ripvid-*-${{ needs.create-release.outputs.version }}
          merge-multiple: true

      - name: Verify platform artifacts
        shell: bash
        run: |
          set -euo pipefail
          find . -type f -maxdepth 8 -print | sort
          test -n "$(find . -type f -name '*.dmg' -print -quit)" || { echo 'Missing macOS DMG'; exit 1; }
          test -n "$(find . -type f -name '*.AppImage' -print -quit)" || { echo 'Missing Linux AppImage'; exit 1; }
          test -n "$(find . -type f -name '*.deb' -print -quit)" || { echo 'Missing Linux deb'; exit 1; }
          test -n "$(find . -type f -name '*.rpm' -print -quit)" || { echo 'Missing Linux rpm'; exit 1; }
          test -n "$(find . -type f -name '*.exe' -print -quit)" || { echo 'Missing Windows executable'; exit 1; }
          test -n "$(find . -type f -name '*.msi' -print -quit)" || { echo 'Missing Windows MSI'; exit 1; }

  # Security scan
  security-scan:
    permissions:
      contents: read
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit Rust dependencies
        run: cargo audit
        working-directory: src-tauri
